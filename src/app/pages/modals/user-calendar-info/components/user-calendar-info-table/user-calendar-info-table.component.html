<ng-container *transloco="let t">
  <p-table
    [value]="calendarGlobalInfoParsed()"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th>horario</th>
        <th>lunes</th>
        <th>martes</th>
        <th>miercoles</th>
        <th>jueves</th>
        <th>viernes</th>
      </tr>
    </ng-template>
    <ng-template #body let-hour let-editing="editing">
      <tr>
        <td>{{ hour.value }}</td>
        <td [pEditableColumn]="hour.monday" pEditableColumnField="monday">
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" [(ngModel)]="hour.monday" />
            </ng-template>
            <ng-template #output>
              {{ hour.monday }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="hour.tuesday" pEditableColumnField="tuesday">
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" [(ngModel)]="hour.tuesday" />
            </ng-template>
            <ng-template #output>
              {{ hour.tuesday }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="hour.wednesday" pEditableColumnField="wednesday">
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" [(ngModel)]="hour.wednesday" />
            </ng-template>
            <ng-template #output>
              {{ hour.wednesday }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="hour.thursday" pEditableColumnField="thursday">
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" [(ngModel)]="hour.thursday" />
            </ng-template>
            <ng-template #output>
              {{ hour.thursday }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="hour.friday" pEditableColumnField="friday">
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" [(ngModel)]="hour.friday" />
            </ng-template>
            <ng-template #output>
              {{ hour.friday }}
            </ng-template>
          </p-cellEditor>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div class="mt-8 flex items-center justify-end-safe">
    <p-button
      [disabled]="this.calendarStore.isLoading()"
      (onClick)="saveUserCalendarInfo()"
      [label]="t('Guardar configuracion')"
      severity="success"
    >
    </p-button>
  </div>
</ng-container>
