<ng-container *transloco="let t">
  <form [formGroup]="newSessionForm" (submit)="createNewUnit()">
    <div class="flex flex-col items-center justify-center">
      <p-float-label class="w-full" variant="in">
        <input
          class="w-full"
          pInputText
          id="sessionName"
          formControlName="sessionName"
          noSuggest
        />
        <label for="unityName">{{
          t("DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_NAME")
        }}</label>
      </p-float-label>
      <app-swapper
        class="mt-6"
        [headerText]="
          t(
            'DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_ACTIVITIES'
          )
        "
      >
        <ng-template #firstComponent>
          <p-floatlabel class="w-full" variant="in">
            <textarea
              formControlName="activities"
              [ngModel]="
                this.newSessionForm.controls.activities.value | sanitizeHTML
              "
              class="w-full"
              pTextarea
              [autoResize]="true"
              noSuggest
            ></textarea>
            <label for="in_label">{{
              t(
                "DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_ACTIVITIES"
              )
            }}</label>
          </p-floatlabel>
        </ng-template>
        <ng-template #secondComponent>
          <app-text-editor
            formControlName="activities"
            class="w-full"
          ></app-text-editor>
        </ng-template>
      </app-swapper>
      <app-swapper
        class="mt-6"
        [headerText]="
          t(
            'DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_EVALUATION'
          )
        "
      >
        <ng-template #firstComponent>
          <p-floatlabel class="w-full" variant="in">
            <textarea
              formControlName="evaluation"
              [ngModel]="
                this.newSessionForm.controls.evaluation.value | sanitizeHTML
              "
              class="w-full"
              pTextarea
              [autoResize]="true"
              noSuggest
            ></textarea>
            <label for="in_label">{{
              t(
                "DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_EVALUATION"
              )
            }}</label>
          </p-floatlabel>
        </ng-template>
        <ng-template #secondComponent>
          <app-text-editor
            formControlName="evaluation"
            class="w-full"
          ></app-text-editor>
        </ng-template>
      </app-swapper>
      <app-swapper
        class="mt-6"
        [headerText]="
          t(
            'DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_ATTENTION_OF_DIVERSITY'
          )
        "
      >
        <ng-template #firstComponent>
          <p-floatlabel class="w-full" variant="in">
            <textarea
              formControlName="attentionOfDiversity"
              [ngModel]="
                this.newSessionForm.controls.attentionOfDiversity.value
                  | sanitizeHTML
              "
              class="w-full"
              pTextarea
              [autoResize]="true"
              noSuggest
            ></textarea>
            <label for="in_label">{{
              t(
                "DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_ATTENTION_OF_DIVERSITY"
              )
            }}</label>
          </p-floatlabel>
        </ng-template>
        <ng-template #secondComponent>
          <app-text-editor
            formControlName="attentionOfDiversity"
            class="w-full"
          ></app-text-editor>
        </ng-template>
      </app-swapper>
      <app-swapper
        class="mt-6"
        [headerText]="
          t(
            'DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_OBSERVATIONS'
          )
        "
      >
        <ng-template #firstComponent>
          <p-floatlabel class="w-full" variant="in">
            <textarea
              formControlName="observations"
              [ngModel]="
                this.newSessionForm.controls.observations.value | sanitizeHTML
              "
              class="w-full"
              pTextarea
              [autoResize]="true"
              noSuggest
            ></textarea>
            <label for="in_label">{{
              t(
                "DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.FORM.SESSION_OBSERVATIONS"
              )
            }}</label>
          </p-floatlabel>
        </ng-template>
        <ng-template #secondComponent>
          <app-text-editor
            formControlName="observations"
            class="w-full"
          ></app-text-editor>
        </ng-template>
      </app-swapper>
    </div>
    <div class="mt-16 flex items-center justify-end gap-4">
      <p-button
        (onClick)="close()"
        [disabled]="unityStore.isLoading()"
        severity="secondary"
        [label]="t('DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.ACTIONS.CLOSE')"
      />
      <p-button
        [loading]="unityStore.isLoading()"
        severity="primary"
        type="submit"
        [disabled]="newSessionForm.invalid || !newSessionForm.dirty"
        [label]="t('DASHBOARD.RECORDS.MODALS.CREATE_NEW_SESSION.ACTIONS.SAVE')"
      />
    </div>
  </form>
</ng-container>
