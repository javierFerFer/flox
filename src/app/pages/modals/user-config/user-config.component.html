<ng-container *transloco="let t">
  <form
    class="overflow-hidden"
    [formGroup]="userConfigForm"
    (submit)="updateUserConfig()"
  >
    <div class="flex items-center justify-center">
      <app-user-image id="photo" formControlName="photo"></app-user-image>
    </div>
    <div class="mt-8 flex items-center">
      <span class="w-full">{{
        t("SHARED_MODALS.USER_CONFIG.FORM.APP_LANGUAGE")
      }}</span>
      <p-select
        [options]="languages"
        formControlName="appLanguage"
        optionLabel="name"
        optionValue="code"
        class="w-full md:w-56"
      >
        <ng-template #selectedItem let-selectedOption>
          @if (selectedOption) {
            <div class="flex items-center gap-2">
              <div>{{ t(selectedOption.name) }}</div>
            </div>
          }
        </ng-template>
        <ng-template let-element #item>
          <div class="flex items-center gap-2">
            <div>{{ t(element.name) }}</div>
          </div>
        </ng-template>
      </p-select>
    </div>
    <div class="mt-8 flex items-center">
      <span class="w-full">{{
        t("SHARED_MODALS.USER_CONFIG.FORM.AUTO_SUGGEST_INPUTS.LABEL")
      }}</span>
      <p-select
        [options]="autoCompleteOptions"
        formControlName="autoComplete"
        optionLabel="name"
        optionValue="value"
        class="w-full md:w-56"
      >
        <ng-template #selectedItem let-selectedOption>
          @if (selectedOption) {
            <div class="flex items-center gap-2">
              <div>{{ t(selectedOption.name) }}</div>
            </div>
          }
        </ng-template>
        <ng-template let-element #item>
          <div class="flex items-center gap-2">
            <div>{{ t(element.name) }}</div>
          </div>
        </ng-template>
      </p-select>
    </div>
    <div class="mt-16 flex items-center justify-end gap-4">
      <p-button
        severity="success"
        type="submit"
        [loading]="this.userStore.isLoading()"
        [disabled]="userConfigForm.invalid || !userConfigForm.dirty"
        [label]="t('SHARED_MODALS.USER_CONFIG.FORM.ACTIONS.SAVE')"
      />
    </div>
  </form>
</ng-container>
