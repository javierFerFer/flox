<ng-container *transloco="let t">
  <p-card>
    <div class="pb-8">
      <h2 class="text-2xl font-semibold">
        {{ t("SHARED_MODALS.USER_CONFIG.CALENDAR_PREFERENCES.TITLE") }}
      </h2>
      <p class="text-gray-500">
        {{ t("SHARED_MODALS.USER_CONFIG.CALENDAR_PREFERENCES.SUB_TITLE") }}
      </p>
    </div>
    <div class="mt-4 flex items-center">
      <span class="w-full">{{
        t("SHARED_MODALS.USER_CONFIG.CALENDAR_PREFERENCES.MODIFY_TEXT")
      }}</span>
      <p-button
        (onClick)="navigateToCalendarConfig()"
        severity="primary"
        [label]="
          t('SHARED_MODALS.USER_CONFIG.CALENDAR_PREFERENCES.ACTIONS.MODIFY')
        "
      />
    </div>
  </p-card>
</ng-container>
<router-outlet name="calendar-preferences-outlet"></router-outlet>
