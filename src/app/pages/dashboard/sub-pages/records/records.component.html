<ng-container *transloco="let t">
  <p-card>
    <p-tabs value="0" scrollable>
      <p-tablist #tabListRef>
        @for (tabElement of tabListElements(); track tabElement.value) {
          <p-tab
            [value]="tabElement.value"
            [routerLink]="[tabElement.routerLink]"
          >
            @if (tabElement?.title) {
              <span>
                {{ tabElement.title! }}
              </span>
            }
            @if (tabElement?.keyToTranslate) {
              <span>
                <i
                  [ngClass]="tabElement.cssClass ? tabElement.cssClass : ''"
                ></i>
                {{ t(tabElement?.keyToTranslate!) }}
              </span>
            }
          </p-tab>
        }
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0">
          <!-- <p class="m-0">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
          eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad
          minim veniam, quis nostrud exercitation ullamco laboris nisi ut
          aliquip ex ea commodo consequat. Duis aute irure dolor in
          reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla
          pariatur. Excepteur sint occaecat cupidatat non proident, sunt in
          culpa qui officia deserunt mollit anim id est laborum.
        </p> -->
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </p-card>
  <router-outlet name="recordsModals"></router-outlet>
</ng-container>
